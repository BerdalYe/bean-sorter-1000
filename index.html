<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bean Sorter 1000</title>
<meta name="description" content="A strangely serious simulator about sorting 1,000 beans by hand.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Big+Shoulders+Stencil+Display:wght@700;900&family=Martian+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- BEGIN APP -->
<div id="app">
  <canvas id="world" aria-label="Sorting table"></canvas>

  <header id="hud" hidden>
    <div class="hud-row">
      <div class="plate"><span class="plate-k" id="plate-k">Level 1</span><span class="plate-v" id="plate-v">Orientation</span></div>
      <div class="readouts">
        <div class="ro ro-wide"><span class="ro-k" id="ro-remaining-k">Beans remaining</span><span class="ro-v" id="ro-remaining">0 / 0</span></div>
        <div class="ro"><span class="ro-k">Accuracy</span><span class="ro-v" id="ro-acc">100.0%</span></div>
        <div class="ro"><span class="ro-k">Streak</span><span class="ro-v" id="ro-streak">0</span></div>
        <div class="ro"><span class="ro-k">Best streak</span><span class="ro-v" id="ro-best">0</span></div>
        <div class="ro"><span class="ro-k" id="ro-time-k">Time</span><span class="ro-v" id="ro-time">00:00</span></div>
      </div>
      <div class="hud-tools">
        <div class="level-gauge" id="bubble" hidden title="Table level"><i></i></div>
        <button class="icon-btn" id="btn-fit" data-action="fit" aria-label="Reset view" title="Reset view (0)"></button>
        <button class="icon-btn" id="btn-mute" data-action="mute" aria-label="Mute sound" title="Sound (M)"></button>
        <button class="icon-btn" id="btn-pause" data-action="pause" aria-label="Pause" title="Pause (Esc)"></button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
  </header>

  <div id="memos" aria-live="polite"></div>
  <div id="combo" aria-live="polite"></div>
  <div id="hint" class="hint" hidden></div>

  <div id="tray" hidden><div class="tray-inner" id="bins"></div></div>

  <canvas id="fx" aria-hidden="true"></canvas>

  <div id="toasts" aria-live="polite"></div>
  <div id="inspect" class="inspect" hidden></div>
  <div id="finale" class="finale" hidden></div>
  <div id="flash" aria-hidden="true"></div>
  <div id="screens" hidden></div>
</div>
<script type="module" src="js/main.js"></script>
<!-- END APP -->
</body>
</html>
